<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#05060a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MEWD Demo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<title>MEWD</title>
<meta name="description" content="MEWD — Made Entirely Without Doom. Burn down a supermarket at night. Then the forest.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2308090d'/%3E%3Cpath d='M8 2c1 3 3 3 3 6a3 3 0 0 1-6 0c0-2 1-2 1-4 1 1 1 2 2 2 0-2-1-3 0-4z' fill='%23e8621a'/%3E%3Cpath d='M8 7c.6 1.4 1.4 1.6 1.4 3A1.4 1.4 0 0 1 6.6 10c0-1.2.8-1.4 1.4-3z' fill='%23ffe07a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
<!-- Three r160, vendored rather than fetched from a CDN, so the game
     runs off a memory stick. -->
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
</head>
<body>

<!-- THE FRONT DOOR. A terminal over everything: black glass, white type in a pale-ruled box,
     one prompt, and no word about what it wants. js/terminal.js types
     every line out and refuses every entry but one; on that one it
     imports js/main.js, which boots the game under it exactly as it
     did when this page loaded it directly, and this fades away. The
     rest of the page below is the game, untouched, waiting. -->
<div id="term" aria-label="terminal">
  <div id="term-out"></div>
  <input id="term-in" type="text" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" aria-label="terminal input" autofocus>
</div>

<div id="game">
  <!-- THE READOUT, and it is not part of the picture. Its own canvas,
       over the frame, outside the pixel filter entirely: real type at
       the device's own resolution, drawn by js/hud.js. The game itself
       is the sibling canvas #view, which IS filtered. -->
  <canvas id="ui"></canvas>
</div>

<!-- The phone's controls. Hidden until the game is being played by
     touch; touch.js does everything else. -->
<div id="touch" hidden>
  <div class="hint hint-move"><span>MOVE</span></div>
  <div class="hint hint-look">DRAG TO LOOK</div>
  <div class="stick"><div class="knob"></div></div>
  <div class="tb tb-use" data-btn="use" role="button" aria-label="Use">USE</div>
  <div class="tb tb-swap" data-btn="swap" role="button" aria-label="Next weapon">SWAP</div>
  <!-- only on screen with a gun that has a screen on it in hand — the
       lance, and the quad launcher's thermal sight — and the second of
       them only while it is up at the eye: js/touch.js shows them -->
  <div class="tb tb-aim" data-btn="aim" role="button" aria-label="Aim — raise the scope to your eye, or lower it" aria-pressed="false" hidden>AIM</div>
  <div class="tb tb-zoom" data-btn="zoom" role="button" aria-label="Scope magnification" hidden>1&times;</div>
  <div class="tb tb-jump" data-btn="jump" role="button" aria-label="Jump">JUMP</div>
  <div class="tb tb-fire" data-btn="fire" role="button" aria-label="Fire — hold to fire, drag to sweep">FIRE</div>
  <div class="tb tb-pause" data-btn="pause" role="button" aria-label="Pause"><i></i><i></i></div>
</div>

<!-- A PHONE HELD UPRIGHT, at the user's request, is an error: the whole
     glass goes red, with the rotate glyph out of Google's Material Icons
     font ("screen_rotation", Apache 2.0) inlined as its path so nothing
     is fetched, and two words. It goes the moment the phone is turned. -->
<div id="rotate" role="alert" aria-label="Rotate device">
  <svg class="rot-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.48 2.52c3.27 1.55 5.61 4.72 5.97 8.48h1.5C23.44 4.84 18.29 0 12 0l-.66.03 3.81 3.81 1.33-1.32zm-6.25-.77c-.59-.59-1.54-.59-2.12 0L1.75 8.11c-.59.59-.59 1.54 0 2.12l12.02 12.02c.59.59 1.54.59 2.12 0l6.36-6.36c.59-.59.59-1.54 0-2.12L10.23 1.75zm4.6 19.44L2.81 9.17l6.36-6.36 12.02 12.02-6.36 6.36zm-7.31.29C4.25 19.94 1.91 16.76 1.55 13H.05C.56 19.16 5.71 24 12 24l.66-.03-3.81-3.81-1.33 1.32z"/></svg>
  <div class="rot-text">ROTATE DEVICE</div>
</div>

<!-- Loading: the name, a line, and a bar. -->
<div id="loading">
  <div class="panel">
    <div class="logo-slot small">
    <img class="logo" src="assets/logo/mewd-960.webp"
         srcset="assets/logo/mewd-480.webp 480w, assets/logo/mewd-960.webp 960w, assets/logo/mewd-1440.webp 1440w, assets/logo/mewd-1951.webp 1951w"
         sizes="min(64vw, 36rem)" alt="MEWD" width="1951" height="954" decoding="async">
    </div>
    <div id="load-status">RETICULATING SPLINES</div>
    <div class="bar"><div id="load-bar"></div></div>
  </div>
</div>

<!-- The title: the name over the car park, as big as the glass will
     take it, and under it the menu, the way Doom did it — a column of
     words and a marker beside the one you are on. Up and down move the
     marker, enter or a tap takes it. Only NEW GAME goes anywhere yet;
     the rest are there, dimmed, where they will be. -->
<div id="title" class="gone">
  <div class="title-wrap">
    <div class="logo-slot big">
    <img class="logo" src="assets/logo/mewd-960.webp"
         srcset="assets/logo/mewd-480.webp 480w, assets/logo/mewd-960.webp 960w, assets/logo/mewd-1440.webp 1440w, assets/logo/mewd-1951.webp 1951w"
         sizes="(max-height: 520px) min(60vw, 150vh), min(96vw, 112vh, 1951px)" alt="MEWD" width="1951" height="954" decoding="async">
    </div>
    <nav id="main-menu" class="mainmenu" aria-label="Main menu">
      <button class="mm on" type="button" data-act="new">NEW GAME</button>
      <button class="mm" type="button" data-act="continue" aria-disabled="true">CONTINUE</button>
      <button class="mm" type="button" data-act="load" aria-disabled="true">LOAD GAME</button>
      <button class="mm" type="button" data-act="options" aria-disabled="true">OPTIONS</button>
      <button class="mm" type="button" data-act="multi" aria-disabled="true">MULTIPLAYER</button>
      <button class="mm" type="button" data-act="quit" aria-disabled="true">QUIT GAME</button>
    </nav>
  </div>
  <!-- which build this is: js/version.js, written in by main.js -->
  <div id="version"></div>
</div>

<!-- Paused: four pages of square tiles, and nothing in here scrolls.
     A tile says what it is, what it is set to, and — as a bar, or a dot
     per stop — where that sits among what it could be. TAPPING ONE
     CYCLES IT, a switch being a cycle of two; a tile holding a number
     between two numbers opens THE WINDOW below instead, with a slider
     in it big enough for a thumb. The pages are tabbed rather than
     scrolled, at the user's request: a phone held sideways is a wide,
     short window, and a long column in one is empty down both sides and
     cut off at the bottom. -->
<!-- ON A TEST RUN FROM THE EDITOR, a way back that is always on screen:
     tapped on a touch screen, or F2 / Esc on a keyboard -->
<button id="to-editor" type="button" hidden>&#9664; EDITOR <kbd>F2</kbd></button>

<div id="pause" class="gone">
  <div class="panel menu">
    <h2>PAUSED</h2>
    <div class="tabs" role="tablist" aria-label="Menu pages">
      <button class="tab on" type="button" role="tab" aria-selected="true" data-page="1">1 CONTROLS</button>
      <button class="tab" type="button" role="tab" aria-selected="false" data-page="2">2 PICTURE</button>
      <button class="tab" type="button" role="tab" aria-selected="false" data-page="3">3 LEVELS</button>
      <button class="tab" type="button" role="tab" aria-selected="false" data-page="4">4 WORLD</button>
      <button class="tab" type="button" role="tab" aria-selected="false" data-page="5">5 DEBUG</button>
    </div>

    <div class="pages">
      <!-- 1: how it is played -->
      <div class="tiles" data-page="1" role="tabpanel" aria-label="Controls">
        <button class="tile" type="button" data-dial="sens">
          <span class="tn">LOOK SPEED</span><b class="tv">1.0X</b><i class="tm bar"><span></span></i>
        </button>
        <button id="opt-invert" class="tile" type="button" aria-pressed="false">
          <span class="tn">INVERT LOOK</span><b class="tv">OFF</b><i class="tm"></i>
        </button>
        <button id="opt-lefty" class="tile touch-only" type="button" aria-pressed="false">
          <span class="tn">LEFT-HANDED</span><b class="tv">OFF</b><i class="tm"></i>
        </button>
        <button id="opt-haptic" class="tile touch-only" type="button" aria-pressed="true">
          <span class="tn">VIBRATION</span><b class="tv">ON</b><i class="tm"></i>
        </button>
        <button class="tile" type="button" data-dial="music">
          <span class="tn">MUSIC</span><b class="tv">50%</b><i class="tm bar"><span></span></i>
        </button>
        <button id="opt-full" class="tile" type="button" hidden>
          <span class="tn">FULLSCREEN</span><b class="tv">OFF</b><i class="tm"></i>
        </button>
      </div>

      <!-- 2: what the picture is made of -->
      <div class="tiles" data-page="2" role="tabpanel" aria-label="Picture" hidden>
        <button class="tile" type="button" data-dial="res">
          <span class="tn">RENDER</span><b class="tv">720P</b><i class="tm bar"><span></span></i>
        </button>
        <button class="tile" type="button" data-dial="pix">
          <span class="tn">PIXELS</span><b class="tv">240P</b><i class="tm bar"><span></span></i>
        </button>
        <button id="opt-pixar" class="tile" type="button">
          <span class="tn">PIXEL ASPECT</span><b class="tv">TALL 5:6</b><i class="tm"></i>
        </button>
        <button id="opt-palette" class="tile" type="button">
          <span class="tn">PALETTE</span><b class="tv">RAMPS</b><i class="tm"></i>
        </button>
        <button id="opt-tone" class="tile" type="button">
          <span class="tn">TONE</span><b class="tv">EARTH</b><i class="tm"></i>
        </button>
      </div>

      <!-- 3: the three dials the finished frame goes through -->
      <div class="tiles" data-page="3" role="tabpanel" aria-label="Levels" hidden>
        <button class="tile" type="button" data-dial="bright">
          <span class="tn">BRIGHTNESS</span><b class="tv">1.35</b><i class="tm bar"><span></span></i>
        </button>
        <button class="tile" type="button" data-dial="contrast">
          <span class="tn">CONTRAST</span><b class="tv">1.00</b><i class="tm bar"><span></span></i>
        </button>
        <button class="tile" type="button" data-dial="gamma">
          <span class="tn">GAMMA</span><b class="tv">1.00</b><i class="tm bar"><span></span></i>
        </button>
      </div>

      <!-- 4: what is in it, and what the night is doing -->
      <div class="tiles" data-page="4" role="tabpanel" aria-label="World" hidden>
        <button id="opt-crowd" class="tile" type="button">
          <span class="tn">CROWD</span><b class="tv">EVERYONE</b><i class="tm"></i>
        </button>
        <button id="opt-fx" class="tile" type="button">
          <span class="tn">EFFECTS</span><b class="tv">FULL</b><i class="tm"></i>
        </button>
        <button id="opt-wood" class="tile" type="button">
          <span class="tn">THE WOOD</span><b class="tv">ALL OF IT</b><i class="tm"></i>
        </button>
        <button id="opt-time" class="tile" type="button">
          <span class="tn">TIME</span><b class="tv">02:00</b><i class="tm bar"><span></span></i>
        </button>
        <button id="opt-weather" class="tile" type="button">
          <span class="tn">WEATHER</span><b class="tv">CLEAR</b><i class="tm"></i>
        </button>
      </div>

      <!-- 5: the switches, and what the frame is spent on -->
      <div class="tiles" data-page="5" role="tabpanel" aria-label="Debug" hidden>
        <button id="opt-debug" class="tile" type="button" aria-pressed="true">
          <span class="tn">DEBUG: INFINITE AMMO</span><b class="tv">ON</b><i class="tm"></i>
        </button>
        <button id="opt-godmode" class="tile" type="button" aria-pressed="true">
          <span class="tn">DEBUG: INVINCIBLE</span><b class="tv">ON</b><i class="tm"></i>
        </button>
        <button id="opt-haze" class="tile" type="button" aria-pressed="true">
          <span class="tn">DEBUG: FIRE HAZE</span><b class="tv">ON</b><i class="tm"></i>
        </button>
        <button id="opt-fps" class="tile" type="button" aria-pressed="false">
          <span class="tn">FRAME RATE</span><b class="tv">OFF</b><i class="tm"></i>
        </button>
      </div>
    </div>

    <!-- the ones that are not settings, on every page. DOWNLOAD is the
         user's: it hands you the whole site as one zip file, to keep
         and to run on your own machine without a network. See
         js/pack.js, and RUN-ME.txt inside the archive. -->
    <div class="foot">
      <button id="btn-resume" class="btn primary" type="button">RESUME</button>
      <!-- a test run from the editor's Play button: straight back to it
           (F2 does the same from anywhere) -->
      <button id="btn-editor" class="btn" type="button" hidden>BACK TO EDITOR</button>
      <button id="btn-restart" class="btn quiet" type="button">RESTART</button>
      <button id="btn-download" class="btn quiet" type="button">DOWNLOAD</button>
    </div>
  </div>
</div>

<!-- THE WINDOW A TILE OPENS, for the settings that are a number between
     two numbers rather than a short list to walk round: the name, the
     slider, a nudge either side of it for the step a thumb cannot hit,
     and the value under. One window; the slot for whichever tile asked
     is the one that is shown. -->
<div id="dial" class="gone">
  <div class="dial-box" role="dialog" aria-modal="true" aria-labelledby="dial-name">
    <h3 id="dial-name">LOOK SPEED</h3>
    <div class="slot" data-dial="sens" hidden>
      <button class="nudge" type="button" data-nudge="-1" aria-label="lower">&minus;</button>
      <input id="opt-sens" type="range" min="0.4" max="2.4" step="0.1" value="1" aria-label="Look speed">
      <button class="nudge" type="button" data-nudge="1" aria-label="higher">+</button>
      <b id="opt-sens-v">1.0X</b>
    </div>
    <div class="slot" data-dial="music" hidden>
      <button class="nudge" type="button" data-nudge="-1" aria-label="quieter">&minus;</button>
      <input id="opt-music" type="range" min="0" max="1" step="0.05" value="0.5" aria-label="Music">
      <button class="nudge" type="button" data-nudge="1" aria-label="louder">+</button>
      <b id="opt-music-v">50%</b>
    </div>
    <div class="slot" data-dial="bright" hidden>
      <button class="nudge" type="button" data-nudge="-1" aria-label="darker">&minus;</button>
      <input id="opt-bright" type="range" min="0.5" max="2.2" step="0.05" value="1.35" aria-label="Brightness">
      <button class="nudge" type="button" data-nudge="1" aria-label="brighter">+</button>
      <b id="opt-bright-v">1.35</b>
    </div>
    <div class="slot" data-dial="contrast" hidden>
      <button class="nudge" type="button" data-nudge="-1" aria-label="flatter">&minus;</button>
      <input id="opt-contrast" type="range" min="0.5" max="1.8" step="0.05" value="1" aria-label="Contrast">
      <button class="nudge" type="button" data-nudge="1" aria-label="harder">+</button>
      <b id="opt-contrast-v">1.00</b>
    </div>
    <div class="slot" data-dial="gamma" hidden>
      <button class="nudge" type="button" data-nudge="-1" aria-label="lower">&minus;</button>
      <input id="opt-gamma" type="range" min="0.6" max="2.0" step="0.05" value="1" aria-label="Gamma">
      <button class="nudge" type="button" data-nudge="1" aria-label="higher">+</button>
      <b id="opt-gamma-v">1.00</b>
    </div>
    <!-- the two ladders: the slider walks the rungs, and the nudges are
         the steppers this menu used to wear on its face -->
    <div class="slot" data-dial="res" hidden>
      <button id="opt-res-down" class="nudge" type="button" aria-label="lower">&minus;</button>
      <input id="opt-res" type="range" min="0" max="8" step="1" value="8" aria-label="Render height">
      <button id="opt-res-up" class="nudge" type="button" aria-label="higher">+</button>
      <b id="opt-res-v">720P</b>
    </div>
    <div class="slot" data-dial="pix" hidden>
      <button id="opt-pix-down" class="nudge" type="button" aria-label="chunkier">&minus;</button>
      <input id="opt-pix" type="range" min="0" max="8" step="1" value="3" aria-label="Pixel height">
      <button id="opt-pix-up" class="nudge" type="button" aria-label="finer">+</button>
      <b id="opt-pix-v">240P</b>
    </div>
    <button id="dial-done" class="btn primary" type="button">DONE</button>
  </div>
</div>

<div id="fps" hidden></div>

<!-- js/main.js is not loaded here any more: js/terminal.js loads it,
     when it is given the word. -->
<script type="module" src="js/terminal.js"></script>
</body>
</html>
