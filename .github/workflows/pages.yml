# The same two jobs as .gitlab-ci.yml, for the place the repository
# actually lives. Both call tools/build-site.sh, so there is one
# definition of what the site is and no chance of the two drifting.
name: test and publish

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One queue per ref. A shared queue let the pull request's run, which
# starts the moment the branch is pushed, cancel main's run a second
# later, so main was tested and never published. A newer push to the
# same pull request still cancels the older run; a run on main is never
# cancelled, so a deploy is never cut off halfway.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: smoke test
        # A TOWN-SIZED MAP NEEDS THE ROOM. The suite builds the whole map
        # three times with the town on it — eleven thousand regions and a
        # fuel grid of a million and a half cells each — and eight more
        # times with { town: false }, which is the shop as it was. Node's
        # default heap on a runner is under what that needs and the job
        # died with FatalProcessOutOfMemory rather than a failing check,
        # which is the kind of red that teaches nobody anything.
        run: node --max-old-space-size=4096 tools/smoke-test.mjs
      - name: art is in step with art/
        run: |
          cp js/art-data.js /tmp/art-data.committed.js
          node tools/bake-art.mjs
          if ! diff -q /tmp/art-data.committed.js js/art-data.js > /dev/null; then
            echo "js/art-data.js is stale — art/ has changed since it was baked."
            echo "Run: node tools/bake-art.mjs   and commit the result."
            exit 1
          fi

  publish:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # THE SITE IS THE GODOT BUILD (GODOT.txt), for WebGL 2, at the root;
      # the web build in js/ stays up under classic/.
      - name: Godot 4.3
        run: |
          curl -sSL -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          mkdir -p "$HOME/bin"
          unzip -q -o /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v4.3-stable_linux.x86_64 "$HOME/bin/godot"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      # the templates come in a 1 GB archive of every platform's; only the
      # web one is kept, and kept between runs
      - id: templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/4.3.stable
          key: godot-4.3-web-templates
      - name: Godot's web export template
        if: steps.templates.outputs.cache-hit != 'true'
        run: |
          T="$HOME/.local/share/godot/export_templates/4.3.stable"
          mkdir -p "$T"
          curl -sSL -o /tmp/tpl.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -o -j /tmp/tpl.tpz templates/web_nothreads_release.zip templates/version.txt -d "$T"
          rm /tmp/tpl.tpz
      - name: export the Godot build for the web
        run: sh tools/build-web.sh build/web
      - name: assemble the site
        run: |
          sh tools/build-site.sh public/classic
          cp -r build/web/. public/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: public }
      - id: deploy
        uses: actions/deploy-pages@v4
