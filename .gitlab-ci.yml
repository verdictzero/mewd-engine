# =====================================================================
# MEWD — test, then publish
# =====================================================================
#
# Run the classic build's checks, then export the Godot build for the
# web and put it, with the classic build under classic/, into public/
# for GitLab Pages (the same site as .github/workflows/pages.yml).
#
# THE CHECKS RUN BEFORE THE DEPLOY AND THE DEPLOY DEPENDS ON THEM. A
# broken build that reaches the URL is worse than no deploy: this is a
# game, so nobody files a bug, they just close the tab. `needs` makes
# the dependency explicit rather than relying on stage ordering, so the
# pages job cannot be retried past a red test.
#
# There is no npm install anywhere on purpose. tools/smoke-test.mjs
# stubs three.js itself and everything else in the repo is dependency
# free, so the pipeline is one container pull and about a second of
# actual work.

default:
  image: node:22-alpine
  interruptible: true

stages:
  - test
  - deploy

# 522 checks: the palette, the texture and sprite bakeries, the map, the
# collision, the state tables and the fire grid. No browser needed —
# everything that is not WebGL is exercised here.
smoke test:
  stage: test
  script:
    - node --version
    # the heap: see the same step in .github/workflows — the map is a
    # town now and the suite builds it three times
    - node --max-old-space-size=4096 tools/smoke-test.mjs

# The art in art/ is baked into js/art-data.js by hand, deliberately, so
# that the game has no build step. That is only safe if something checks
# the two have not drifted — otherwise a re-exported logo sits in the
# repo looking authoritative while the game still draws the old one.
art is in step:
  stage: test
  script:
    - cp js/art-data.js /tmp/art-data.committed.js
    - node tools/bake-art.mjs
    - |
      if ! diff -q /tmp/art-data.committed.js js/art-data.js > /dev/null; then
        echo "js/art-data.js is stale — art/ has changed since it was baked."
        echo "Run: node tools/bake-art.mjs   and commit the result."
        exit 1
      fi
    - echo "art-data.js matches art/"

# THE SITE IS THE GODOT BUILD (GODOT.txt) at the root, exported for
# WebGL 2 with no threads, and the classic build in js/ under classic/ —
# the same site .github/workflows/pages.yml publishes. Godot 4.3 and
# its web export template are fetched here; the template (the one zip
# out of a gigabyte archive of every platform's) is kept in the cache
# between pipelines, inside the project tree where GitLab's cache can
# see it, and linked to where Godot looks.
pages:
  stage: deploy
  image: node:22-bookworm
  needs: ["smoke test", "art is in step"]
  variables:
    GODOT_VERSION: "4.3-stable"
    TEMPLATES: "$CI_PROJECT_DIR/.godot-templates"
  cache:
    key: godot-4.3-web-templates
    paths:
      - .godot-templates/
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends unzip > /dev/null
    - curl -sSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/$GODOT_VERSION/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
    - unzip -q -o /tmp/godot.zip -d /tmp/godot
    - install -m 755 "/tmp/godot/Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
    - |
      if [ ! -f "$TEMPLATES/web_nothreads_release.zip" ]; then
        mkdir -p "$TEMPLATES"
        curl -sSL -o /tmp/tpl.tpz "https://github.com/godotengine/godot/releases/download/$GODOT_VERSION/Godot_v${GODOT_VERSION}_export_templates.tpz"
        unzip -o -j /tmp/tpl.tpz templates/web_nothreads_release.zip templates/version.txt -d "$TEMPLATES"
        rm /tmp/tpl.tpz
      fi
    # inside the project tree, so Godot must not import or export it
    - ": > \"$TEMPLATES/.gdignore\""
    - mkdir -p "$HOME/.local/share/godot/export_templates"
    - ln -sfn "$TEMPLATES" "$HOME/.local/share/godot/export_templates/4.3.stable"
  script:
    - sh tools/build-web.sh build/web
    - sh tools/build-site.sh public/classic
    - cp -r build/web/. public/
  artifacts:
    paths:
      - public
  rules:
    # Only the default branch is the published game. Everything else gets
    # tested and nothing more.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
